name: build-service-template

on:
  push:
    paths:
      - "service-template/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: |
          docker build \
            -t config-aware-service:latest \
            service-template
